name: TicTacToe CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/philip222111/450-tictactest-mvk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java im Container prüfen
        run: java -version

      - name: Projekt bauen und Tests ausführen
        run: bash gradlew --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME" build

      - name: Testberichte bereitstellen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
