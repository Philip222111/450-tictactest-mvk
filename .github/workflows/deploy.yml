name: Deploy release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v1.1.0
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: tictactest-production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate before any mutation
        run: aws sts get-caller-identity > /dev/null
      - name: Download and verify release assets (no build, no OpenTofu)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release-assets
          gh release download "$TAG" --dir release-assets --pattern '*.jar' --pattern '*.zip' --pattern deployment.json --pattern '*.sha256'
          (cd release-assets && sha256sum -c *.sha256)
      - name: Deploy release with S3 and SSM, check public versions
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 scripts/deploy_cloud.py
